# The Romanian translation's release: Actions > Release (română) > Run workflow with a tag v<port version>-ro<n> (v1.0.3-ro1),
# or pushing such a tag, builds pt.exe on that code and
# publishes a GitHub Release with only the translated pt.exe and an install guide (.github/romana/CITESTE-MA.txt). The release
# text is .github/romana/release.md; {{VERSION}}, {{TAG}}, {{ZIP}} and {{SHA256}} are filled in here.
name: Release (română)

on:
  push:
    tags: ['v*-ro*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag-ul Release-ului (v<versiune>-ro<n>)'
        required: true
        default: 'v1.0.3-ro1'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)-ro\d+$') { throw "tag $tag is not v<x.y.z>-ro<n>" }
          $version = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch "set\(PT_VERSION `"$([regex]::Escape($version))`"\)") { throw "CMakeLists.txt is not version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=PT-PC-Port-$version-Traducere-Romana.zip" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile $installer
          & $installer --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Ninja
        run: pip install ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          cmake --preset release -B build\release || exit /b 1
          cmake --build build\release --target pt_release || exit /b 1

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "${{ steps.version.outputs.zip }}"
          New-Item -ItemType Directory out\pkg | Out-Null
          Copy-Item build\release\pt_release.exe out\pkg\pt.exe
          $sha = (Get-FileHash out\pkg\pt.exe -Algorithm SHA256).Hash.ToLower()
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Fill($text) {
            $text.Replace('{{VERSION}}', $version).Replace('{{TAG}}', "${{ steps.version.outputs.tag }}").Replace('{{ZIP}}', $zip).Replace('{{SHA256}}', $sha)
          }
          $guide = Fill ([IO.File]::ReadAllText(".github\romana\CITESTE-MA.txt", $utf8))
          [IO.File]::WriteAllText("out\pkg\CITESTE-MA.txt", ($guide -replace "`r?`n", "`r`n"), $utf8)
          [IO.File]::WriteAllText("out\notes.md", (Fill ([IO.File]::ReadAllText(".github\romana\release.md", $utf8))), $utf8)
          Compress-Archive -Path out\pkg\* -DestinationPath "out\$zip"
          Get-ChildItem out

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # a tag that does not exist yet is made on this run's commit
          gh release create "${{ steps.version.outputs.tag }}" "out\${{ steps.version.outputs.zip }}" --target "${{ github.sha }}" `
            --title "P.T. PC Port $version — Traducere în limba română" `
            --notes-file out\notes.md --latest
